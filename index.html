<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASSCE Grade Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; max-width: 450px; margin: auto; }
    h1 { text-align: center; color: #333; font-size: 22px; }
    p { text-align: center; color: #666; font-size: 14px; }
    h3 { margin-top: 20px; color: #007bff; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    .subject { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; }
    label { font-weight: bold; font-size: 15px; }
    select { padding: 6px; font-size: 15px; border-radius: 4px; border: 1px solid #ccc; }
    button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 20px; font-weight: bold; }
    #result { margin-top: 20px; text-align: center; font-size: 22px; font-weight: bold; color: #007bff; }
  </style>
</head>
<body>

  <h1>WASSCE Aggregate Calculator</h1>
  <p>Select your grades to compute your total score:</p>

  <h3>Core Subjects</h3>
  <div class="subject"><label>English Language</label><select class="grade"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select></div>
  <div class="subject"><label>Core Mathematics</label><select class="grade"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select></div>
  <div class="subject"><label>Integrated Science</label><select class="grade"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select></div>
  <div class="subject"><label>Social Studies</label><select class="grade"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select></div>

  <h3>Best 3 Electives</h3>
  <div class="subject"><label>Elective 1</label><select class="grade"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select></div>
  <div class="subject"><label>Elective 2</label><select class="grade"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select></div>
  <div class="subject"><label>Elective 3</label><select class="grade"><option value="1">A1</option><option value="2">B2</option><option value="3">B3</option><option value="4">C4</option><option value="5">C5</option><option value="6">C6</option><option value="7">D7</option><option value="8">E8</option><option value="9">F9</option></select></div>

  <button onclick="calculateAggregate()">Calculate Aggregate</button>
  <div id="result"></div>

  <script>
    function calculateAggregate() {
      const grades = document.querySelectorAll('.grade');
      let total = 0;
      grades.forEach(g => total += parseInt(g.value));
      document.getElementById('result').innerText = 'Total Aggregate: ' + total;
    }
  </script>

</body>
  </html>
